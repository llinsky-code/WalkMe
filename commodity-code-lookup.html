<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commodity Code Lookup</title>
<style>
  :root{
    --ink:#12181f;
    --ink-soft:#4a5568;
    --paper:#faf9f6;
    --panel:#ffffff;
    --line:#e4e1da;
    --header:#151b25;
    --header-line:#2a323f;
    --seg:#4d5b93;
    --seg-bg:#eceefa;
    --fam:#1b8a8a;
    --fam-bg:#e4f4f2;
    --cls:#b9832a;
    --cls-bg:#faf1e0;
    --cmd:#b8506b;
    --cmd-bg:#faeaee;
    --focus:#2a7d7d;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  code, .mono{
    font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,Courier,monospace;
  }

  /* header */
  header{
    background:var(--header);
    color:#f2f0ea;
    padding:22px 24px 20px;
    flex-shrink:0;
    border-bottom:1px solid var(--header-line);
    background-image:
      radial-gradient(circle at 1.5px 1.5px, rgba(255,255,255,0.05) 1px, transparent 0);
    background-size:18px 18px;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#8a94a6;
    font-weight:600;
    margin:0 0 6px;
  }
  h1{
    margin:0 0 14px;
    font-size:22px;
    font-weight:650;
    letter-spacing:-0.01em;
  }
  .search-wrap{
    position:relative;
    max-width:640px;
  }
  #search{
    width:100%;
    padding:12px 42px 12px 40px;
    border-radius:9px;
    border:1px solid #384154;
    background:#1d2430;
    color:#f2f0ea;
    font-size:15px;
    outline:none;
    transition:border-color .15s, background .15s;
  }
  #search::placeholder{color:#7c8598;}
  #search:focus{border-color:var(--focus);background:#20293a;}
  .search-icon{
    position:absolute;
    left:13px;
    top:50%;
    transform:translateY(-50%);
    width:16px;
    height:16px;
    color:#7c8598;
    pointer-events:none;
  }
  #clear-btn{
    position:absolute;
    right:8px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:#7c8598;
    cursor:pointer;
    font-size:18px;
    padding:4px 6px;
    line-height:1;
    display:none;
  }
  #clear-btn:hover{color:#f2f0ea;}

  .chips{
    display:flex;
    gap:8px;
    margin-top:14px;
    flex-wrap:wrap;
  }
  .chip{
    font-size:12px;
    font-weight:600;
    padding:5px 11px;
    border-radius:20px;
    border:1px solid #384154;
    background:transparent;
    color:#b7bfcd;
    cursor:pointer;
    transition:all .15s;
  }
  .chip:hover{border-color:#5a6478;color:#f2f0ea;}
  .chip.active{background:#f2f0ea;color:var(--header);border-color:#f2f0ea;}
  .chip .dot{
    display:inline-block;
    width:7px;height:7px;
    border-radius:50%;
    margin-right:6px;
    position:relative;
    top:-1px;
  }

  /* main */
  main{
    flex:1;
    padding:18px 24px 40px;
    max-width:900px;
    width:100%;
    margin:0 auto;
  }
  .status-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin:4px 2px 12px;
    font-size:12.5px;
    color:var(--ink-soft);
  }
  .status-row b{color:var(--ink);}

  .crumbs{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:4px;
    margin:0 2px 14px;
    font-size:13px;
  }
  .crumbs button{
    background:none;
    border:none;
    padding:3px 6px;
    border-radius:5px;
    font-size:13px;
    color:var(--ink-soft);
    cursor:pointer;
    font-family:inherit;
  }
  .crumbs button:hover{background:var(--line);color:var(--ink);}
  .crumbs .current{
    padding:3px 6px;
    font-weight:650;
    color:var(--ink);
  }
  .crumbs .sep{color:#c8c3b8;font-size:12px;}

  .list{
    display:flex;
    flex-direction:column;
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  .row{
    background:var(--panel);
    padding:12px 14px;
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
    transition:background .1s;
  }
  .row:hover{background:#f3f1ec;}
  .row.leaf{cursor:default;}
  .row.leaf:hover{background:var(--panel);}

  .lvl-badge{
    flex-shrink:0;
    font-size:10px;
    font-weight:700;
    letter-spacing:.04em;
    padding:3px 6px;
    border-radius:5px;
    text-transform:uppercase;
    width:38px;
    text-align:center;
  }
  .lvl-2{color:var(--seg);background:var(--seg-bg);}
  .lvl-4{color:var(--fam);background:var(--fam-bg);}
  .lvl-6{color:var(--cls);background:var(--cls-bg);}
  .lvl-8{color:var(--cmd);background:var(--cmd-bg);}

  .row-code{
    flex-shrink:0;
    font-size:13px;
    color:var(--ink-soft);
    width:82px;
  }
  .row-main{
    flex:1;
    min-width:0;
  }
  .row-name{
    font-size:14.5px;
    font-weight:500;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .row-path{
    font-size:11.5px;
    color:#9a9488;
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  mark{
    background:#ffe8a3;
    color:inherit;
    border-radius:2px;
    padding:0 1px;
  }
  .chev{
    flex-shrink:0;
    color:#c2bcae;
    font-size:16px;
  }

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty .big{
    font-size:32px;
    margin-bottom:10px;
  }
  .empty p{margin:4px 0;font-size:14px;}

  .more-note{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    padding:14px 0 0;
  }
  .row-reason{
    font-size:11.5px;
    color:var(--focus);
    margin-top:2px;
    font-style:italic;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .ai-badge{
    flex-shrink:0;
    font-size:9.5px;
    font-weight:700;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:#fff;
    background:linear-gradient(135deg,#2a7d7d,#4d5b93);
    padding:2px 6px;
    border-radius:5px;
    margin-left:4px;
  }
  .status-loading{
    display:inline-flex;
    align-items:center;
    gap:6px;
    color:var(--ink-soft);
  }
  .spinner{
    width:11px;height:11px;
    border-radius:50%;
    border:2px solid #d8d3c8;
    border-top-color:var(--focus);
    animation:spin .7s linear infinite;
    display:inline-block;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .fallback-note{
    font-size:11px;
    color:#a39d90;
    text-align:center;
    padding-top:6px;
  }

  footer{
    text-align:center;
    font-size:11.5px;
    color:#a39d90;
    padding:0 20px 22px;
  }

  @media (max-width:520px){
    header{padding:18px 16px 16px;}
    main{padding:14px 14px 30px;}
    h1{font-size:19px;}
    .row-code{width:66px;font-size:12px;}
    .row-path{display:none;}
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Catalog Reference</p>
  <h1>Commodity Code Lookup</h1>
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="search" type="text" placeholder="Search by code or keyword…" autocomplete="off" spellcheck="false">
    <button id="clear-btn" aria-label="Clear search">&times;</button>
  </div>
  <div class="chips" id="chips">
    <button class="chip active" data-lvl="all">All levels</button>
    <button class="chip" data-lvl="2"><span class="dot" style="background:var(--seg)"></span>Segment</button>
    <button class="chip" data-lvl="4"><span class="dot" style="background:var(--fam)"></span>Family</button>
    <button class="chip" data-lvl="6"><span class="dot" style="background:var(--cls)"></span>Class</button>
    <button class="chip" data-lvl="8"><span class="dot" style="background:var(--cmd)"></span>Commodity</button>
  </div>
</header>

<main>
  <div class="status-row" id="statusRow"></div>
  <div class="crumbs" id="crumbs"></div>
  <div class="list" id="list"></div>
  <div class="more-note" id="moreNote"></div>
</main>

<footer id="footerNote"></footer>

const byCode = new Map();
DATA.forEach(d => byCode.set(d.c, d));
const childrenOf = new Map();
DATA.forEach(d => {
  if(!childrenOf.has(d.p)) childrenOf.set(d.p, []);
  childrenOf.get(d.p).push(d);
});
childrenOf.forEach(list => list.sort((a,b) => a.n.localeCompare(b.n)));

function levelOf(code){ return code.length; }
function hasChildren(code){ return childrenOf.has(code) && childrenOf.get(code).length > 0; }

function ancestors(code){
  const path = [];
  let cur = byCode.get(code);
  while(cur && cur.p && byCode.has(cur.p)){
    cur = byCode.get(cur.p);
    path.unshift(cur);
  }
  return path;
}

function escapeHtml(s){
  return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
function highlight(text, query){
  if(!query) return escapeHtml(text);
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if(idx === -1) return escapeHtml(text);
  return escapeHtml(text.slice(0,idx)) + '<mark>' + escapeHtml(text.slice(idx, idx+query.length)) + '</mark>' + escapeHtml(text.slice(idx+query.length));
}
function pathLabel(code){
  return ancestors(code).map(a => a.n).join(' › ');
}

const STOPWORDS = new Set(['a','an','the','of','for','with','and','or','to','in','on','my','our','i','need','want','some','any','please']);

function tokenize(text){
  return text.toLowerCase().split(/[^a-z0-9]+/).filter(t => t && !STOPWORDS.has(t));
}
function expandTokens(tokens){
  const set = new Set();
  tokens.forEach(t => {
    set.add(t);
    if(SYNONYMS[t]) SYNONYMS[t].forEach(s => set.add(s));
  });
  return set;
}
function levenshtein(a,b){
  if(Math.abs(a.length-b.length) > 2) return 99;
  const dp = Array(b.length+1).fill(0).map((_,i)=>i);
  for(let i=1;i<=a.length;i++){
    let prev = dp[0]; dp[0] = i;
    for(let j=1;j<=b.length;j++){
      const tmp = dp[j];
      dp[j] = a[i-1]===b[j-1] ? prev : 1+Math.min(prev,dp[j],dp[j-1]);
      prev = tmp;
    }
  }
  return dp[b.length];
}
function localScore(queryTokens, expandedSet, phraseLower, item){
  const nameLower = item.n.toLowerCase();
  let score = 0;
  if(phraseLower && nameLower.includes(phraseLower)) score += 6;
  const nameTokens = tokenize(item.n);
  expandedSet.forEach(qt => {
    if(nameTokens.includes(qt)){ score += 3; return; }
    for(const nt of nameTokens){
      if(nt.length>=4 && qt.length>=4 && levenshtein(nt,qt) <= 1){ score += 1.5; return; }
      if(nt.startsWith(qt) || qt.startsWith(nt)){ score += 1; return; }
    }
  });
  // original (non-expanded) query tokens matching is worth more
  queryTokens.forEach(qt => { if(nameTokens.includes(qt)) score += 1; });
  return score;
}
function getLocalResults(query, levelFilter, limit){
  const q = query.trim().toLowerCase();
  const qTokens = tokenize(q);
  const expanded = expandTokens(qTokens);
  let results = DATA.map(item => {
    const code = item.c.toLowerCase();
    let score = 0;
    if(code === q) score = 1000;
    else if(q.length>=2 && code.startsWith(q)) score = 500;
    else score = localScore(qTokens, expanded, q, item);
    return {item, score};
  }).filter(r => r.score > 0);
  if(levelFilter !== 'all'){
    results = results.filter(r => levelOf(r.item.c) === Number(levelFilter));
  }
  results.sort((a,b) => b.score - a.score || a.item.n.localeCompare(b.item.n));
  return limit ? results.slice(0, limit) : results;
}

function renderCrumbs(){
  crumbsEl.innerHTML = '';
  if(state.mode !== 'browse'){ return; }
  const trail = ancestors(state.parent).concat(state.parent ? [byCode.get(state.parent)] : []);
  const rootBtn = document.createElement('button');
  rootBtn.textContent = 'All categories';
  rootBtn.onclick = () => { setBrowse(''); };
  crumbsEl.appendChild(rootBtn);
  trail.forEach(node => {
    const sep = document.createElement('span');
    sep.className = 'sep';
    sep.textContent = '›';
    crumbsEl.appendChild(sep);
    if(node.c === state.parent){
      const span = document.createElement('span');
      span.className = 'current';
      span.textContent = node.n;
      crumbsEl.appendChild(span);
    } else {
      const btn = document.createElement('button');
      btn.textContent = node.n;
      btn.onclick = () => setBrowse(node.c);
      crumbsEl.appendChild(btn);
    }
  });
}

function rowHTML(item, opts){
  const lvl = levelOf(item.c);
  const lvlLabel = {2:'Segment',4:'Family',6:'Class',8:'Item'}[lvl] || '';
  const showChev = hasChildren(item.c);
  const nameHtml = opts.query ? highlight(item.n, opts.query) : escapeHtml(item.n);
  const pathHtml = opts.showPath ? '<div class="row-path">' + escapeHtml(pathLabel(item.c) || 'Top level') + '</div>' : '';
  return '<div class="row ' + (showChev ? '' : 'leaf') + '" data-code="' + item.c + '">' +
    '<span class="lvl-badge lvl-' + lvl + '">' + lvlLabel + '</span>' +
    '<span class="row-code mono">' + item.c + '</span>' +
    '<div class="row-main"><div class="row-name">' + nameHtml + '</div>' + pathHtml + '</div>' +
    (showChev ? '<span class="chev">›</span>' : '') +
    '</div>';
}

function attachRowHandlers(){
  listEl.querySelectorAll('.row').forEach(row => {
    row.addEventListener('click', () => {
      const code = row.getAttribute('data-code');
      if(hasChildren(code)){
        setBrowse(code);
      } else if(state.mode === 'search'){
        const item = byCode.get(code);
        setBrowse(item.p);
      }
    });
  });
}

function renderEmpty(msg1, msg2){
  listEl.innerHTML = '<div class="empty"><div class="big">🔍</div><p><b>' + msg1 + '</b></p><p>' + msg2 + '</p></div>';
  moreNoteEl.textContent = '';
}

function renderBrowse(){
  renderCrumbs();
  let items = childrenOf.get(state.parent) || [];
  if(state.level !== 'all'){
    items = items.filter(i => levelOf(i.c) === Number(state.level));
  }
  statusEl.innerHTML = '<span><b>' + items.length + '</b> ' + (items.length===1?'item':'items') + (state.parent ? ' in this category' : ' at top level') + '</span>';
  if(items.length === 0){
    renderEmpty('Nothing here', 'Try a different level filter, or search by keyword instead.');
    return;
  }
  listEl.innerHTML = items.map(i => rowHTML(i, {query:'', showPath:false})).join('');
  moreNoteEl.textContent = '';
  attachRowHandlers();
}

function renderSearch(){
  crumbsEl.innerHTML = '';
  const query = state.query.trim();
  const results = getLocalResults(query, state.level, null);

  statusEl.innerHTML = '<span><b>' + results.length + '</b> result' + (results.length===1?'':'s') + ' for "' + escapeHtml(query) + '"</span>';

  if(results.length === 0){
    renderEmpty('No matches', 'Check the spelling, try a different keyword, or search by partial code.');
    return;
  }
  const LIMIT = 250;
  const shown = results.slice(0, LIMIT);
  listEl.innerHTML = shown.map(r => rowHTML(r.item, {query: query, showPath:true})).join('');
  moreNoteEl.textContent = results.length > LIMIT ? ('Showing first ' + LIMIT + ' of ' + results.length + ' — refine your search to narrow further.') : '';
  attachRowHandlers();
}

function render(){
  if(state.mode === 'search' && state.query.trim().length > 0){
    renderSearch();
  } else {
    state.mode = 'browse';
    renderBrowse();
  }
}

function setBrowse(parentCode){
  state.mode = 'browse';
  state.parent = parentCode;
  state.query = '';
  searchEl.value = '';
  clearBtn.style.display = 'none';
  render();
}

  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  state.level = chip.getAttribute('data-lvl');
  render();
});

render();
</script>
</body>
</html>
